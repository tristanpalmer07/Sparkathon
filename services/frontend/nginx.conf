server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads can be large; don't cap request bodies, and give
    # slow uploads/transcodes room before nginx gives up on the proxy.
    client_max_body_size 0;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location /api/events/ {
        proxy_pass http://events-api:8001/;
        proxy_http_version 1.1;
    }

    location /api/ingest/ {
        proxy_pass http://ingest-api:8002/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
